<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket PilotAI</title>
<!-- ===== THƯ VIỆN CDN: Chart.js (biểu đồ), canvas-confetti (pháo giấy), html2canvas (xuất ảnh) ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============================================================
   POCKET PILOTAI v3 — GIAO DIỆN
   Tông chính: hồng pastel #EC4899 + tím #C084FC
   ============================================================ */
:root{
  --pink:#EC4899; --purple:#C084FC; --blue:#2563EB; --teal:#10B981;
  --green:#16A34A; --lime:#84CC16; --red:#EF4444; --amber:#F59E0B;
  --bg:#FDF2F8; --bg2:#FAF5FF; --card:#FFFFFF; --card2:#FDF4FF;
  --text:#1F2937; --muted:#6B7280; --border:#F3E8FF;
  --shadow:0 8px 24px rgba(236,72,153,.10);
  --grad:linear-gradient(135deg,#EC4899,#C084FC);
  --grad-green:linear-gradient(135deg,#16A34A,#84CC16);
  --grad-blue:linear-gradient(135deg,#2563EB,#10B981);
}
body.dark{
  --bg:#0F0A1A; --bg2:#171025; --card:#1E1530; --card2:#251A3A;
  --text:#F3E8FF; --muted:#A78BCA; --border:#3B2A55;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;transition:background .5s,color .5s;font-size:16px}

/* ---------- Micro-interactions & bounce ---------- */
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.28) rotate(-7deg)}55%{transform:scale(.92) rotate(4deg)}80%{transform:scale(1.06)}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.4}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
button{transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
button:active{transform:scale(.93)}
input:focus,select:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 4px rgba(236,72,153,.15);transform:translateY(-1px)}
input,select{transition:border .2s,box-shadow .25s,transform .25s}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:50;background:var(--grad);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
header .logo{font-size:1.35rem;font-weight:800;display:flex;align-items:center;gap:8px}
header .badges{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.badge{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600}
.iconbtn{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:999px;min-width:38px;height:38px;font-size:1.05rem;cursor:pointer;padding:0 10px;font-weight:800}
.iconbtn:hover{transform:scale(1.12);background:rgba(255,255,255,.35)}

/* ---------- Tabs ---------- */
nav{display:flex;gap:6px;padding:12px 16px 0;max-width:1200px;margin:0 auto;flex-wrap:wrap}
nav button{flex:1;min-width:100px;border:none;padding:12px 8px;border-radius:14px 14px 0 0;background:transparent;color:var(--muted);font-weight:700;font-size:.92rem;cursor:pointer;transition:all .25s}
nav button.active{background:var(--card);color:var(--pink);box-shadow:var(--shadow)}
nav button:hover:not(.active){color:var(--purple)}

main{max-width:1200px;margin:0 auto;padding:16px}
.tabpane{display:none;animation:fadeSlide .45s ease}
.tabpane.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Cards & layout ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px)}
.card h3{font-size:1.02rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden}
.stat .lbl{font-size:.82rem;opacity:.92;font-weight:600}
.stat .val{font-size:1.45rem;font-weight:800;margin-top:4px;word-break:break-word}
.stat.pink{background:var(--grad)} .stat.blue{background:var(--grad-blue)}
.stat.green{background:var(--grad-green)} .stat.amber{background:linear-gradient(135deg,#F59E0B,#EC4899)}

/* ---------- Form ---------- */
label{display:block;font-size:.86rem;font-weight:700;margin:10px 0 5px;color:var(--muted)}
input[type=number],input[type=text],input[type=password],input[type=date],select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--text);font-size:1rem}
.btn{border:none;border-radius:14px;padding:13px 20px;font-weight:800;font-size:1rem;cursor:pointer;color:#fff;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 22px rgba(236,72,153,.35)}
.btn:active{transform:scale(.95)}
.btn.main{background:var(--grad);width:100%;font-size:1.08rem;margin-top:14px}
.btn.ghost{background:var(--card2);color:var(--pink);border:2px solid var(--pink);padding:9px 14px;font-size:.85rem}
.btn.small{padding:8px 13px;font-size:.83rem;border-radius:10px}
.btn.blue{background:var(--grad-blue)} .btn.green{background:var(--grad-green)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.preset{background:var(--card2);border:1.5px dashed var(--purple);color:var(--text);border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;font-weight:600;transition:all .2s,transform .15s cubic-bezier(.34,1.56,.64,1)}
.preset:hover{background:var(--grad);color:#fff;border-style:solid;transform:scale(1.06)}

/* ---------- Vòng tròn tiến độ ---------- */
.rings{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-around}
.ringwrap{position:relative;width:132px;text-align:center}
.ring{width:132px;height:132px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bgc{stroke:var(--card2)}
.ring .fgc{stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)}
.ring-center{position:absolute;top:0;left:0;width:132px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .pct{font-size:1.5rem;font-weight:800}
.ring-lbl{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:6px;line-height:1.3}

/* ---------- AI boxes ---------- */
.insight{background:linear-gradient(135deg,rgba(236,72,153,.09),rgba(192,132,252,.12));border-left:5px solid var(--pink);border-radius:14px;padding:14px 16px;margin-top:10px;line-height:1.65}
.planbox{background:linear-gradient(135deg,rgba(37,99,235,.08),rgba(16,185,129,.10));border-left:5px solid var(--blue);border-radius:14px;padding:14px 16px;margin-top:10px;line-height:1.7}
.warnbox{border-radius:14px;padding:12px 15px;margin-top:10px;font-weight:600;display:flex;gap:10px;align-items:flex-start;line-height:1.5;animation:fadeSlide .4s ease}
.warnbox.red{background:rgba(239,68,68,.12);border-left:5px solid var(--red);color:var(--red)}
.warnbox.amber{background:rgba(245,158,11,.13);border-left:5px solid var(--amber);color:#B45309}
.warnbox.green{background:rgba(22,163,74,.12);border-left:5px solid var(--green);color:var(--green)}
body.dark .warnbox.amber{color:#FCD34D}

/* ---------- Bảng ---------- */
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:var(--card2)}
.tag{border-radius:999px;padding:3px 11px;font-size:.75rem;font-weight:700;white-space:nowrap}
.tag.thu{background:rgba(16,185,129,.15);color:var(--teal)}
.tag.chi{background:rgba(236,72,153,.15);color:var(--pink)}
.tag.cat{background:rgba(192,132,252,.16);color:var(--purple)}
.tag.due-soon{background:rgba(239,68,68,.15);color:var(--red)}
.tag.due-mid{background:rgba(245,158,11,.16);color:#B45309}
.tag.due-far{background:rgba(22,163,74,.13);color:var(--green)}
.pri-cao{color:var(--red);font-weight:700}.pri-tb{color:var(--amber);font-weight:700}.pri-thap{color:var(--muted)}

/* ---------- Huy hiệu ---------- */
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.ach{border:2px solid var(--border);border-radius:16px;padding:12px 8px;text-align:center;transition:all .3s;background:var(--card2)}
.ach .ic{font-size:1.9rem;display:inline-block}
.ach .nm{font-weight:800;font-size:.82rem;margin-top:4px}
.ach .ds{font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.3}
.ach.locked{filter:grayscale(1);opacity:.45}
.ach.unlocked{border-color:var(--pink);background:linear-gradient(135deg,rgba(236,72,153,.1),rgba(192,132,252,.12))}

/* ---------- Thử thách ---------- */
.challenge{border:1.5px dashed var(--purple);border-radius:16px;padding:14px;margin-top:10px}
.challenge .row{justify-content:space-between}
.pbar{height:12px;background:var(--card2);border-radius:999px;overflow:hidden;border:1px solid var(--border);margin-top:8px}
.pbar>div{height:100%;background:var(--grad-green);border-radius:999px;width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.pbar.pink>div{background:var(--grad)}

/* ---------- Báo cáo ---------- */
.report-sec{margin-top:16px;padding-top:12px;border-top:1px dashed var(--border)}
.report-sec h4{font-size:.95rem;margin-bottom:8px;color:var(--purple)}
.catrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.catrow .nm{width:170px;font-size:.88rem;font-weight:600;flex-shrink:0}
.catrow .bar{flex:1;height:12px;background:var(--card2);border-radius:999px;overflow:hidden}
.catrow .bar>div{height:100%;background:var(--grad);border-radius:999px;width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}
.catrow .amt{font-size:.84rem;font-weight:700;width:110px;text-align:right;flex-shrink:0}
.habit{display:flex;gap:8px;margin:6px 0;line-height:1.5;font-size:.92rem}

/* ---------- Chat ---------- */
#chatBox{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--card2);border-radius:14px}
.msg{max-width:82%;padding:11px 15px;border-radius:16px;line-height:1.55;animation:fadeSlide .3s ease;font-size:.94rem}
.msg.user{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}

/* ---------- Toast ---------- */
#toasts{position:fixed;top:76px;right:16px;z-index:99;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border-left:5px solid var(--pink);border-radius:12px;padding:13px 18px;box-shadow:var(--shadow);font-weight:600;min-width:230px;max-width:330px;transform:translateX(120%);transition:transform .45s cubic-bezier(.22,1,.36,1)}
.toast.show{transform:none}
.toast.ok{border-color:var(--green)} .toast.warn{border-color:var(--amber)} .toast.err{border-color:var(--red)}

/* ---------- Modal cài đặt ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,10,26,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.modal h3{margin-bottom:6px}
.keyrow{display:flex;gap:8px;align-items:center}
.keyrow input{flex:1}

/* ---------- Khác ---------- */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:.86rem}
.big{font-size:1.8rem;font-weight:800}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
#micBtn.listening{background:var(--red);animation:pulse 1s infinite}
footer{text-align:center;padding:22px;color:var(--muted);font-size:.85rem}
@media(max-width:600px){
  header .logo{font-size:1.1rem}
  .stat .val{font-size:1.15rem}
  nav button{min-width:72px;font-size:.78rem;padding:10px 4px}
  main{padding:10px}
  .card{padding:15px}
  .catrow .nm{width:110px}
}
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header>
  <div class="logo">🚀 Pocket PilotAI</div>
  <div class="badges">
    <span class="badge" id="lvlBadge">⭐</span>
    <span class="badge" id="streakBadge">🔥</span>
    <span class="badge" id="ptsBadge">💎</span>
    <button class="iconbtn" id="langBtn" title="Tiếng Việt / English">EN</button>
    <button class="iconbtn" id="setBtn" data-i18n-title="set_open" title="Cài đặt AI">⚙️</button>
    <button class="iconbtn" id="musicBtn" data-i18n-title="music_t" title="Nhạc nền">🎵</button>
    <button class="iconbtn" id="darkBtn" data-i18n-title="dark_t" title="Sáng/Tối">🌙</button>
  </div>
</header>

<!-- ================= TABS ================= -->
<nav role="tablist">
  <button class="active" data-tab="tab-home" data-i18n="tab_home"></button>
  <button data-tab="tab-tx" data-i18n="tab_tx"></button>
  <button data-tab="tab-subs" data-i18n="tab_subs"></button>
  <button data-tab="tab-report" data-i18n="tab_report"></button>
  <button data-tab="tab-ai" data-i18n="tab_ai"></button>
</nav>

<main>
<!-- ============ TAB 1: TỔNG QUAN ============ -->
<section id="tab-home" class="tabpane active">
  <div class="grid g2">
    <div class="card">
      <h3 data-i18n="f_title"></h3>
      <label for="inBalance" data-i18n="l1"></label>
      <input type="number" id="inBalance" min="0" data-i18n-ph="ph1">
      <label for="inIncome" data-i18n="l2"></label>
      <input type="number" id="inIncome" min="0" data-i18n-ph="ph2">
      <label for="inExpense" data-i18n="l3"></label>
      <input type="number" id="inExpense" min="0" data-i18n-ph="ph3">
      <label for="inDays" data-i18n="l4"></label>
      <input type="number" id="inDays" min="1" data-i18n-ph="ph4">
      <label for="inGoal" data-i18n="l5"></label>
      <input type="number" id="inGoal" min="0" data-i18n-ph="ph5">

      <div class="presets">
        <button class="preset" data-p="chi:30000:Ăn sáng" data-i18n="p1"></button>
        <button class="preset" data-p="chi:50000:Ăn trưa" data-i18n="p2"></button>
        <button class="preset" data-p="chi:25000:Trà sữa" data-i18n="p3"></button>
        <button class="preset" data-p="chi:100000:Xăng xe" data-i18n="p4"></button>
        <button class="preset" data-p="thu:500000:Lương thêm" data-i18n="p5"></button>
      </div>

      <div class="row" style="margin-top:12px">
        <button class="btn main" id="analyzeBtn" style="flex:1" data-i18n="analyze"></button>
        <button class="btn blue" id="micBtn" style="margin-top:14px" data-i18n-title="mic_t">🎤</button>
      </div>
      <p class="muted" style="margin-top:8px" data-i18n="mic_tip"></p>
    </div>

    <div>
      <div class="grid g4" id="overviewPanel">
        <div class="stat pink"><div class="lbl" data-i18n="s_bal"></div><div class="val" id="stBalance">0 ₫</div></div>
        <div class="stat blue"><div class="lbl" data-i18n="s_inc"></div><div class="val" id="stIncome">0 ₫</div></div>
        <div class="stat amber"><div class="lbl" data-i18n="s_exp"></div><div class="val" id="stExpense">0 ₫</div></div>
        <div class="stat green"><div class="lbl" data-i18n="s_proj"></div><div class="val" id="stProjected">0 ₫</div></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 data-i18n="pr_title"></h3>
        <div class="row" style="justify-content:space-between">
          <div><div class="muted" data-i18n="pr_avg"></div><div class="big" id="stAvg" style="color:var(--pink)">0 ₫</div></div>
          <div><div class="muted" data-i18n="pr_days"></div><div class="big" id="stDaysLast" style="color:var(--blue)">—</div></div>
        </div>
        <div id="insightBox" class="insight"></div>
        <div id="planBox" class="planbox" style="display:none"></div>
        <div id="warnings"></div>
        <div class="row" style="margin-top:14px">
          <button class="btn ghost small" id="ttsBtn" data-i18n="b_tts"></button>
          <button class="btn ghost small" id="copyBtn" data-i18n="b_copy"></button>
          <button class="btn ghost small" id="txtBtn" data-i18n="b_txt"></button>
          <button class="btn ghost small" id="imgBtn" data-i18n="b_img"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 data-i18n="r_title"></h3>
    <div class="rings">
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 132 132"><circle class="bgc" cx="66" cy="66" r="52"/><circle class="fgc" id="ringGoal" cx="66" cy="66" r="52" stroke="#16A34A"/></svg>
        <div class="ring-center"><span class="pct" id="ringGoalPct">0%</span><span style="font-size:1.1rem">🎯</span></div>
        <div class="ring-lbl" data-i18n="r_goal"></div>
      </div>
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 132 132"><circle class="bgc" cx="66" cy="66" r="52"/><circle class="fgc" id="ringWeek" cx="66" cy="66" r="52" stroke="#EC4899"/></svg>
        <div class="ring-center"><span class="pct" id="ringWeekPct">0%</span><span style="font-size:1.1rem">🛡️</span></div>
        <div class="ring-lbl" data-i18n="r_week"></div>
      </div>
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 132 132"><circle class="bgc" cx="66" cy="66" r="52"/><circle class="fgc" id="ringDay" cx="66" cy="66" r="52" stroke="#2563EB"/></svg>
        <div class="ring-center"><span class="pct" id="ringDayPct">0%</span><span style="font-size:1.1rem">☀️</span></div>
        <div class="ring-lbl" data-i18n="r_day"></div>
      </div>
    </div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h3 data-i18n="c_title"></h3>
      <div class="challenge">
        <div class="row"><span data-i18n="c_daily"></span>
          <span class="badge" id="dailyStatus" style="background:var(--card2);color:var(--muted)"></span></div>
        <div class="pbar pink"><div id="dailyBar"></div></div>
      </div>
      <div class="challenge">
        <div class="row"><span data-i18n="c_weekly"></span>
          <span class="badge" id="weeklyStatus" style="background:var(--card2);color:var(--muted)"></span></div>
        <div class="pbar"><div id="weeklyBar"></div></div>
      </div>
    </div>
    <div class="card">
      <h3 data-i18n="a_title"></h3>
      <div class="achgrid" id="achGrid"></div>
    </div>
  </div>
</section>

<!-- ============ TAB 2: GIAO DỊCH ============ -->
<section id="tab-tx" class="tabpane">
  <div class="card">
    <h3><span data-i18n="tx_title"></span> <span class="muted" style="font-weight:400" data-i18n="tx_hint"></span></h3>
    <div class="row" style="margin-bottom:12px">
      <span class="muted" data-i18n="sort_lbl"></span>
      <button class="btn ghost small" data-sort="date" data-i18n="sort_date"></button>
      <button class="btn ghost small" data-sort="amount" data-i18n="sort_amt"></button>
      <button class="btn ghost small" data-sort="priority" data-i18n="sort_pri"></button>
      <span class="muted" style="margin-left:auto" data-i18n="tx_30d"></span>
    </div>
    <div style="overflow-x:auto;max-height:440px;overflow-y:auto">
      <table>
        <thead><tr><th data-i18n="th_date"></th><th data-i18n="th_type"></th><th data-i18n="th_note"></th><th data-i18n="th_cat"></th><th data-i18n="th_amt"></th><th data-i18n="th_pri"></th><th></th></tr></thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 data-i18n="add_title"></h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">

  T.push({id:++txId, date:todayISO(-25), type:'thu', amount:4200000, note:'Nhận lương tháng này', priority:3});
  T.push({id:++txId, date:todayISO(-18), type:'thu', amount:300000, note:'Bán sách cũ', priority:2});

/* ---------- ÂM THANH ---------- */
let audioCtx=null, musicNodes=null;
function actx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function ting(){
  try{
    const c=actx(), tt=c.currentTime;
    [880,1320].forEach((f,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.frequency.value=f; o.type='sine';
      g.gain.setValueAtTime(.18,tt+i*.08); g.gain.exponentialRampToValueAtTime(.001,tt+i*.08+.5);
      o.connect(g); g.connect(c.destination); o.start(tt+i*.08); o.stop(tt+i*.08+.55);
    });
  }catch(e){}
}
function toggleMusic(){
  try{
    const c=actx();
    if(musicNodes){ musicNodes.g.gain.linearRampToValueAtTime(0,c.currentTime+.5);
      setTimeout(()=>{musicNodes.o.forEach(o=>o.stop()); musicNodes=null;},600);
      $('musicBtn').textContent='🎵'; toast(t('music_off')); return; }
    const g=c.createGain(); g.gain.value=0; g.connect(c.destination);
    const notes=[261.6,329.6,392,523.3], o=[];
    notes.forEach((f,i)=>{ const os=c.createOscillator(), og=c.createGain();
      os.type='sine'; os.frequency.value=f; og.gain.value=.028;
      const lfo=c.createOscillator(), lg=c.createGain();
      lfo.frequency.value=.1+i*.05; lg.gain.value=.02; lfo.connect(lg); lg.connect(og.gain); lfo.start();
      os.connect(og); og.connect(g); os.start(); o.push(os,lfo); });
    g.gain.linearRampToValueAtTime(.9,c.currentTime+1.5);
    musicNodes={o,g}; $('musicBtn').textContent='🎶'; toast(t('music_on'));
  }catch(e){}
}

function toast(msg,type='ok'){

/* ---------- SỐ CHẠY ---------- */
function countUp(el,target,isMoney=true){
  const from=parseFloat(el.dataset.v||0), dur=900, t0=performance.now();
  el.parentElement&&el.parentElement.classList.add('pop');
  setTimeout(()=>el.parentElement&&el.parentElement.classList.remove('pop'),450);
  function step(ts){
    const p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
    const v=from+(target-from)*e;
    el.textContent=isMoney?fmt(v):Math.round(v).toLocaleString('vi-VN');
    if(p<1) requestAnimationFrame(step); else el.dataset.v=target;
  }
  requestAnimationFrame(step);
}
function setRing(id,pct){
  pct=Math.max(0,Math.min(100,pct||0));
  $(id).style.strokeDashoffset=RING_C*(1-pct/100);
  const el=$(id+'Pct'); el.textContent=Math.round(pct)+'%'; bounceEl(el);
}

/* ---------- THỐNG KÊ ---------- */
function rangeStats(from,to){
  const a=todayISO(from), b=todayISO(to);
  const tx=state.transactions.filter(x=>x.date>=a&&x.date<=b);
  const thu=tx.filter(x=>x.type==='thu').reduce((s,x)=>s+x.amount,0);
  const chi=tx.filter(x=>x.type==='chi').reduce((s,x)=>s+x.amount,0);
  return {tx,thu,chi};
}
function weekStats(){
  const r=rangeStats(-6,0);
  const days=new Set(r.tx.filter(x=>x.type==='chi').map(x=>x.date)).size||1;
  return {...r, avg:r.chi/days};
}
function byCategory(txList){
  const m={};
  txList.filter(x=>x.type==='chi').forEach(x=>{ m[x.cat]=(m[x.cat]||0)+x.amount; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function detectPatterns(){
  const tx=rangeStats(-29,0).tx.filter(x=>x.type==='chi');
  const cnt={};
  tx.forEach(x=>{ const k=x.note.toLowerCase(); cnt[k]=cnt[k]||{n:0,sum:0,note:x.note}; cnt[k].n++; cnt[k].sum+=x.amount; });
  const repetitive=Object.values(cnt).filter(x=>x.n>=6).sort((a,b)=>b.sum-a.sum);
  const lowPri=tx.filter(x=>x.priority===1);
  return {repetitive, lowPri, lowSum:lowPri.reduce((s,x)=>s+x.amount,0)};
}

function readInputs(){
  const bal=parseFloat($('inBalance').value);
  if(isNaN(bal)||bal<0){ toast(t('e_bal'),'err'); $('inBalance').focus(); return null; }
  const inc=parseFloat($('inIncome').value)||0, exp=parseFloat($('inExpense').value)||0;
  if(inc<0||exp<0){ toast(t('e_neg'),'err'); return null; }
  const days=parseInt($('inDays').value);
  if(isNaN(days)||days<1){ toast(t('e_days'),'err'); $('inDays').focus(); return null; }
  const goal=parseFloat($('inGoal').value)||0;
  if(goal<0){ toast(t('e_goal'),'err'); return null; }
  return {bal,inc,exp,days,goal};
}

/* ---------- PHÂN TÍCH BẰNG AI ----------
   silent=true: chỉ vẽ lại giao diện (đổi ngôn ngữ / dark mode),
   KHÔNG cộng điểm, không âm thanh, không confetti — tránh farm điểm. */
function analyze(silent=false){
  const inp=readInputs(); if(!inp) return;
  let {bal,inc,exp,days,goal}=inp;

  if(!silent){
    if(inc>0) addTx('thu',inc,t('today_in'),2,false);
    if(exp>0) addTx('chi',exp,t('today_out'),2,false);
    bal=bal+inc-exp;
    $('inBalance').value=bal; $('inIncome').value=''; $('inExpense').value='';
  }

  const ws=weekStats();
  const subsDue=state.subs.filter(s=>{const d=daysUntil(s.nextDate);return d>=0&&d<=days;});
  const subsDueSum=subsDue.reduce((s,x)=>s+x.amount,0);
  const daysLast=ws.avg>0?bal/ws.avg:Infinity;
  const projected=bal-ws.avg*days-subsDueSum;
  const dailyLimit=Math.max(0,(bal-goal-subsDueSum)/days);
  const m=rangeStats(-29,0);
  const monthIncome=m.thu||4000000;

  countUp($('stBalance'),bal); countUp($('stIncome'),ws.thu);
  countUp($('stExpense'),ws.chi); countUp($('stProjected'),Math.max(projected,0));
  countUp($('stAvg'),ws.avg);
  $('stDaysLast').textContent=isFinite(daysLast)?t('days_u',Math.floor(daysLast)):'∞';
  bounceEl($('stDaysLast'));

  setRing('ringGoal', goal>0?projected/goal*100:100);
  setRing('ringWeek', ws.chi/WEEK_BUDGET*100);
  const chiToday=state.transactions.filter(x=>x.date===todayISO()&&x.type==='chi').reduce((s,x)=>s+x.amount,0);
  setRing('ringDay', dailyLimit>0?chiToday/dailyLimit*100:100);

  const W=$('warnings'); W.innerHTML='';
  const warn=(cls,ic,txt)=>{ const d=document.createElement('div'); d.className='warnbox '+cls; d.innerHTML=ic+' <span>'+txt+'</span>'; W.appendChild(d); };
  if(projected<0) warn('red','🚨',t('wn_out',subsDueSum,Math.max(1,Math.ceil(days-daysLast))));
  else if(ws.avg>dailyLimit&&goal>0) warn('amber','⚠️',t('wn_over',ws.avg,dailyLimit));
  else warn('green','✅',t('wn_ok',isFinite(daysLast)?Math.floor(daysLast):'∞',days));
  if(exp>ws.avg*2&&exp>0) warn('amber','📉',t('wn_big',exp,(exp/ws.avg).toFixed(1)));
  subsDue.filter(s=>daysUntil(s.nextDate)<=5).forEach(s=>warn('amber','🔔',t('wn_sub',s.name,s.amount,daysUntil(s.nextDate),dLabel(s.nextDate))));

  const advice=buildAdvice(bal,ws,days,goal,projected,daysLast,subsDueSum);
  $('insightBox').innerHTML=t('insight_pre')+advice;
  state.lastAdvice=advice.replace(/<[^>]+>/g,'');

  $('planBox').style.display='block';
  $('planBox').innerHTML=t('plan',dailyLimit,days,monthIncome,monthIncome*.5,monthIncome*.3,monthIncome*.2,projected,subsDueSum);

  if(goal>0&&projected>=goal){
    if(!state.goalReached&&!silent){
      confetti({particleCount:180,spread:80,origin:{y:.6},colors:['#EC4899','#C084FC','#84CC16','#10B981']});
      setTimeout(()=>confetti({particleCount:120,angle:60,spread:60,origin:{x:0}}),300);
      setTimeout(()=>confetti({particleCount:120,angle:120,spread:60,origin:{x:1}}),500);
      toast(t('goal_hit'),'ok'); ting(); unlock('goal');
    }
    state.goalReached=true;
  } else state.goalReached=false;

  const dPct=Math.min(100,chiToday/DAILY_CHALLENGE*100);
  $('dailyBar').style.width=dPct+'%';
  if(chiToday<DAILY_CHALLENGE){ $('dailyStatus').textContent=t('c_ok'); $('dailyStatus').style.color='var(--green)'; unlock('daily',silent); }
  else { $('dailyStatus').textContent=t('c_over',chiToday); $('dailyStatus').style.color='var(--red)'; }
  const wPct=Math.min(100,ws.chi/WEEK_BUDGET*100);
  $('weeklyBar').style.width=wPct+'%';
  if(ws.chi<WEEK_BUDGET){ $('weeklyStatus').textContent=t('c_ok'); $('weeklyStatus').style.color='var(--green)'; unlock('weekly',silent); }
  else { $('weeklyStatus').textContent=t('c_over',ws.chi); $('weeklyStatus').style.color='var(--red)'; }
  if(!silent){ bounceEl($('dailyStatus')); bounceEl($('weeklyStatus')); }

  state.lastSummary=
`===== POCKET PILOTAI =====
${new Date().toLocaleDateString(lang==='vi'?'vi-VN':'en-US')}
${t('s_bal').replace(/^\S+ /,'')}: ${fmt(bal)}
${t('s_inc').replace(/^\S+ /,'')}: ${fmt(ws.thu)}
${t('s_exp').replace(/^\S+ /,'')}: ${fmt(ws.chi)}
${t('pr_avg')}: ${fmt(ws.avg)}
${t('pr_days')}: ${isFinite(daysLast)?t('days_u',Math.floor(daysLast)):'∞'}
${t('s_proj').replace(/^\S+ /,'')}: ${fmt(projected)}
${t('r_goal')}: ${fmt(goal)} → ${projected>=goal?'✅':'❌'}
--- AI ---
${state.lastAdvice}`;

  if(!silent){
    state.analyzeCount++;
    if(state.analyzeCount>=5) unlock('analyst');
    addPoints(20,t('pt_analyze'));
    renderTx(); renderSubs(); ting();
  }
}

/* ---------- AI LỜI KHUYÊN ---------- */
function buildAdvice(bal,ws,days,goal,projected,daysLast,subsDueSum){
  const p=[], pat=detectPatterns();
  if(projected<0) p.push(t('adv_danger',ws.avg,subsDueSum));
  else if(goal>0&&projected>=goal) p.push(t('adv_hit',projected,goal));
  else if(goal>0) p.push(t('adv_push',goal,(goal-projected)/days,projected));
  else p.push(t('adv_safe',bal,ws.avg));
  if(pat.repetitive.length){ const r=pat.repetitive[0]; p.push(t('adv_rep',r.note,r.n,r.sum)); }
  if(pat.lowSum>0) p.push(t('adv_low',pat.lowSum));
  if(state.streak>=3) p.push(t('adv_streak',state.streak));
  return p.join(' ');
}

function addTx(type,amount,note,priority=2,notify=true){
  const cat=type==='chi'?categorize(note):'Thu nhập';
  state.transactions.push({id:++txId, date:todayISO(), type, amount, note, priority, cat});
  unlock('first', !notify);
  if(notify){ toast(t('tx_added',type,amount,note,catName(cat)),'ok'); ting(); addPoints(10,null,false); renderTx(); }
}
function renderTx(){
  const k=state.sortKey, asc=state.sortAsc?1:-1, limit=todayISO(-29);
  const arr=state.transactions.filter(x=>x.date>=limit).sort((a,b)=>{
    if(k==='amount') return (a.amount-b.amount)*asc;
    if(k==='priority') return (a.priority-b.priority)*asc;
    return (a.date<b.date?-1:1)*asc;
  });
  const pri={1:[t('pri1'),'pri-thap'],2:[t('pri2'),'pri-tb'],3:[t('pri3'),'pri-cao']};

let catChart=null, weekChart=null;
function buildReport(silent=false){
  const cur=rangeStats(-29,0), prev=rangeStats(-59,-30);
  const cats=byCategory(cur.tx), pat=detectPatterns();
  const total=cur.chi||1;
  const biggestCat=cats[0];
  const biggestTx=cur.tx.filter(x=>x.type==='chi').sort((a,b)=>b.amount-a.amount)[0];
  const chiDelta=prev.chi>0?((cur.chi-prev.chi)/prev.chi*100):0;
  const thuDelta=prev.thu>0?((cur.thu-prev.thu)/prev.thu*100):0;
  const h1=rangeStats(-29,-15).chi, h2=rangeStats(-14,0).chi;
  const trendUp=h2>h1, trendPct=h1>0?Math.abs((h2-h1)/h1*100):0;
  const subsMonthly=state.subs.reduce((s,x)=>s+x.amount,0);
  const savePotential=pat.lowSum*.5+(pat.repetitive[0]?pat.repetitive[0].sum*.5:0);
  const activeDays=new Set(cur.tx.map(x=>x.date)).size;

  const good=[], bad=[];
  if(activeDays>=24) good.push(t('gh_log',activeDays));
  if(cur.thu>=cur.chi) good.push(t('gh_flow',cur.thu,cur.chi));
  if(state.streak>=3) good.push(t('gh_streak',state.streak));
  if(!good.length) good.push(t('gh_start'));
  if(pat.repetitive.length) bad.push(t('bh_repeat',pat.repetitive.slice(0,2).map(r=>t('rep_lbl',r)).join(', ')));
  if(pat.lowSum>total*.15) bad.push(t('bh_lowpri',Math.round(pat.lowSum/total*100),pat.lowSum));
  if(trendUp&&trendPct>10) bad.push(t('bh_trend',Math.round(trendPct)));
  if(subsMonthly>cur.thu*.1) bad.push(t('bh_subs',Math.round(subsMonthly/(cur.thu||1)*100),subsMonthly));
  if(!bad.length) bad.push(t('bh_none'));
  const recs=[];
  if(pat.repetitive[0]) recs.push(t('rc_limit',pat.repetitive[0].note,Math.max(1,Math.floor(pat.repetitive[0].n/2)),pat.repetitive[0].sum/2));
  if(pat.lowSum>0) recs.push(t('rc_wait',pat.lowSum*.4));
  if(biggestCat) recs.push(t('rc_cap',catIcon(biggestCat[0])+' '+catName(biggestCat[0]),biggestCat[1]*.85));
  recs.push(t('rc_payself',(cur.thu||4000000)*.2));
  if(state.subs.length>2) recs.push(t('rc_subs',state.subs.length,subsMonthly));

  const sec=(ti,c)=>`<div class="report-sec"><h4>${ti}</h4>${c}</div>`;
  let html='';
  html+=sec(t('rp1'),
    `<div class="grid g4">
      <div class="stat blue"><div class="lbl">${t('rp_inc')}</div><div class="val">${fmt(cur.thu)}</div></div>
      <div class="stat pink"><div class="lbl">${t('rp_exp')}</div><div class="val">${fmt(cur.chi)}</div></div>
      <div class="stat ${cur.thu-cur.chi>=0?'green':'amber'}"><div class="lbl">${t('rp_diff')}</div><div class="val">${fmt(cur.thu-cur.chi)}</div></div>
      <div class="stat amber"><div class="lbl">${t('rp_save')}</div><div class="val">~${fmt(savePotential)}</div></div>
    </div>`);
  html+=sec(t('rp2'), cats.map(([c,v])=>
    `<div class="catrow"><span class="nm">${catIcon(c)} ${catName(c)}</span>
      <div class="bar"><div style="width:0" data-w="${(v/total*100).toFixed(1)}"></div></div>
      <span class="amt">${fmt(v)} · ${Math.round(v/total*100)}%</span></div>`).join(''));
  html+=sec(t('rp3'),
    `<div class="habit">${biggestCat?t('rp_bigcat',catIcon(biggestCat[0])+' '+catName(biggestCat[0]),fmt(biggestCat[1]),Math.round(biggestCat[1]/total*100)):''}</div>
     <div class="habit">${biggestTx?t('rp_bigtx',biggestTx.note,fmt(biggestTx.amount),dLabel(biggestTx.date)):''}</div>`);
  html+=sec(t('rp4'),
    `<div class="habit">${t('rp_chi',chiDelta>0,Math.abs(chiDelta).toFixed(0),fmt(prev.chi),fmt(cur.chi))}</div>
     <div class="habit">${t('rp_thu',thuDelta>=0,Math.abs(thuDelta).toFixed(0),fmt(prev.thu),fmt(cur.thu))}</div>
     <div class="habit">${t('rp_trend',trendUp,trendPct.toFixed(0))}</div>`);
  html+=sec(t('rp5'), good.map(g=>`<div class="habit">🌟 <span>${g}</span></div>`).join(''));
  html+=sec(t('rp6'), bad.map(b=>`<div class="habit">⚠️ <span>${b}</span></div>`).join(''));
  html+=sec(t('rp7'), recs.map((r,i)=>`<div class="habit">${['🥇','🥈','🥉','🎯','🔍'][i]||'✅'} <span>${r}</span></div>`).join(''));
  $('reportBody').innerHTML=html;
  $('reportCard').hidden=false; $('reportChartsWrap').hidden=false; $('reportCopyBtn').style.display='inline-block';
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll('#reportBody .bar>div').forEach(d=>d.style.width=d.dataset.w+'%');
  },80));

  const textC=getComputedStyle(document.body).getPropertyValue('--muted');
  const gridC=getComputedStyle(document.body).getPropertyValue('--border');
  if(catChart) catChart.destroy();
  catChart=new Chart($('catChart'),{type:'doughnut',
    data:{labels:cats.map(c=>catIcon(c[0])+' '+catName(c[0])),datasets:[{data:cats.map(c=>c[1]),
      backgroundColor:['#EC4899','#C084FC','#2563EB','#10B981','#F59E0B','#84CC16','#EF4444','#6B7280'],borderWidth:0}]},
    options:{plugins:{legend:{position:'bottom',labels:{color:textC}}},cutout:'62%',animation:{animateRotate:!silent,duration:silent?0:1100}}});
  const wl=[],wt=[],wc=[];
  for(let w=3;w>=0;w--){ const r=rangeStats(-(w*7+6),-(w*7));
    wl.push(w===0?t('wk_this'):t('wk_ago',w)); wt.push(r.thu); wc.push(r.chi); }
  if(weekChart) weekChart.destroy();
  weekChart=new Chart($('weekChart'),{type:'bar',
    data:{labels:wl,datasets:[{label:t('ds_thu'),data:wt,backgroundColor:'#10B981',borderRadius:8},{label:t('ds_chi'),data:wc,backgroundColor:'#EC4899',borderRadius:8}]},
    options:{plugins:{legend:{labels:{color:textC}}},scales:{x:{ticks:{color:textC},grid:{color:gridC}},y:{ticks:{color:textC,callback:v=>(v/1000)+'k'},grid:{color:gridC}}},animation:{duration:silent?0:1000}}});

  state.lastReportText=
`===== POCKET PILOTAI — 30D =====
${t('rp_inc')}: ${fmt(cur.thu)} (${thuDelta>=0?'+':''}${thuDelta.toFixed(0)}%)
${t('rp_exp')}: ${fmt(cur.chi)} (${chiDelta>=0?'+':''}${chiDelta.toFixed(0)}%)
${cats.map(([c,v])=>`  - ${catName(c)}: ${fmt(v)} (${Math.round(v/total*100)}%)`).join('\n')}
${t('rp_save')}: ~${fmt(savePotential)}
${t('rp5')}: ${good.join(' | ')}
${t('rp6')}: ${bad.join(' | ')}
${t('rp7')}: ${recs.join(' | ')}`;

  state.reportBuilt=true;
  if(!silent){ unlock('report'); addPoints(30,t('pt_report')); toast(t('rp_ready'),'ok'); ting(); }
}

  r.onresult=e=>{

    let m, type=null, amtRaw=null, unit=null, note='';
    if(lang==='vi'){
      m=text.match(/(chi|thu)\s*([\d.,]+)\s*(k|nghìn|ngàn|triệu|tr)?\s*(.*)/);
      if(m){ type=m[1]; amtRaw=m[2]; unit=m[3]; note=m[4]; }
    } else {
      m=text.match(/(spend|spent|expense|income|earn(?:ed)?|add)\s*\$?([\d.,]+)\s*(k|thousand|million|m)?\s*(?:on|for)?\s*(.*)/);
      if(m){ type=/income|earn/.test(m[1])?'thu':'chi'; amtRaw=m[2]; unit=m[3]; note=m[4]; }
    }
    if(type&&amtRaw){
      let amt=parseFloat(amtRaw.replace(',','.'));
      if(unit==='triệu'||unit==='tr'||unit==='million'||unit==='m') amt*=1000000;
      else if(unit) amt*=1000; else if(amt<1000) amt*=1000;
      addTx(type,amt,note||t('voice_note'),2);
    } else toast(t('not_understood'),'warn');
  };
  r.onerror=()=>toast(t('not_heard'),'warn');
  r.onend=()=>$('micBtn').classList.remove('listening');
  r.start();
};

const getKey = () => store.get('ppai_key','') || AI_API_KEY_FALLBACK;
const getModel = () => store.get('ppai_model','gpt-4o-mini');
function updateAiMode(){ $('aiMode').textContent = getKey()?t('mode_real'):t('mode_local'); }

function financialContext(){
  const ws=weekStats(), m=rangeStats(-29,0);
  const bal=parseFloat($('inBalance').value)||0;
  const goal=parseFloat($('inGoal').value)||0, days=parseInt($('inDays').value)||0;
  const cats=byCategory(m.tx).map(([c,v])=>catName(c)+': '+fmt(v)).join(', ');
  const subs=state.subs.map(s=>`${s.name} ${fmt(s.amount)} (${daysUntil(s.nextDate)}d)`).join(', ');
  return `User data: balance ${fmt(bal)}; avg spend ${fmt(ws.avg)}/day; 30d income ${fmt(m.thu)}; 30d spending ${fmt(m.chi)}; savings goal ${fmt(goal)} in ${days} days; spending by category: ${cats}; subscriptions: ${subs}.`;
}
async function callRealAI(question){
  const res=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'content-type':'application/json','authorization':'Bearer '+getKey()},
    body:JSON.stringify({model:getModel(), max_tokens:400, temperature:.7,
      messages:[
        {role:'system',content:t('sys_prompt')},
        {role:'user',content:financialContext()+'\n\nQuestion: '+question}
      ]})
  });
  if(!res.ok) throw new Error('API '+res.status);
  const d=await res.json();
  return d.choices[0].message.content;
}
function localReply(q){
  q=q.toLowerCase();
  const ws=weekStats(), m=rangeStats(-29,0), bal=parseFloat($('inBalance').value)||0;
  const goal=parseFloat($('inGoal').value)||0, days=parseInt($('inDays').value)||1;
  const subsDueSum=state.subs.filter(s=>{const d=daysUntil(s.nextDate);return d>=0&&d<=days;}).reduce((s,x)=>s+x.amount,0);
  const projected=bal-ws.avg*days-subsDueSum;
  const has=(...ks)=>ks.some(k=>q.includes(k));
  if(has('số dư','còn bao nhiêu','balance','how much money','money left'))
    return t('lr_bal',bal,ws.avg,ws.avg>0?t('days_u',Math.floor(bal/ws.avg)):'∞');
  if(has('mục tiêu','goal'))
    return goal>0?(projected>=goal?t('lr_goal_hit',projected,goal):t('lr_goal_miss',projected,goal-projected,(goal-projected)/days)):t('lr_goal_none');
  if(has('đăng ký','định kỳ','subscription','đến hạn','due')){
    const due=state.subs.filter(s=>{const d=daysUntil(s.nextDate);return d>=0&&d<=7;}).sort((a,b)=>daysUntil(a.nextDate)-daysUntil(b.nextDate));
    const total=state.subs.reduce((s,x)=>s+x.amount,0);
    return due.length?t('lr_subs_due',due.length,due.map(s=>t('lr_subs_item',s.icon,s.name,s.amount,daysUntil(s.nextDate))).join(', '),total):t('lr_subs_none',total);
  }
  if(has('ngân sách','budget')) return t('lr_budget',m.thu||4000000,Math.max(0,(bal-goal-subsDueSum)/days));
  if(has('cắt','giảm','cut','reduce')){
    const pat=detectPatterns();
    if(pat.repetitive.length){ const r=pat.repetitive[0];
      return t('lr_cut_rep',r.note,r.n,r.sum,pat.lowSum,(r.sum+pat.lowSum)/2); }
    return pat.lowSum>0?t('lr_cut_low',pat.lowSum):t('lr_cut_none');
  }
  if(has('báo cáo','report')) return t('lr_report');
  if(has('tiết kiệm','mẹo','tip','save')) return t('lr_tips');
  if(has('chi','spend')&&has('nhiều','trung bình','bao nhiêu','how much','average'))
    return t('lr_spend',m.chi,ws.chi,ws.avg,m.chi>m.thu);
  if(has('chào','hello','hi ','hey')||q==='hi') return t('lr_hello');
  return t('lr_default');
}
/* Gửi tin nhắn — ĐÃ SỬA LỖI LẶP TIN NHẮN:
   1) Bỏ qua phím Enter khi bộ gõ (IME) đang ghép chữ — nguyên nhân
      khiến từ cuối bị gửi lại thành tin nhắn riêng.
   2) Chặn gửi trùng trong 350ms (double Enter/click). */
let sending=false, lastSendAt=0;
async function sendChat(txt){
  const now=Date.now();
  if(sending || now-lastSendAt<350) return;
  txt=(txt!==undefined?txt:$('chatInput').value).trim();
  if(!txt){ toast(t('e_chat_empty'),'warn'); return; }
  sending=true; lastSendAt=now;
  const box=$('chatBox');
  box.insertAdjacentHTML('beforeend','<div class="msg user">'+txt.replace(/</g,'&lt;')+'</div>');
  $('chatInput').value=''; box.scrollTop=box.scrollHeight;
  const typing=document.createElement('div'); typing.className='msg bot pulse'; typing.textContent=t('thinking'); box.appendChild(typing); box.scrollTop=box.scrollHeight;
  let reply;
  try{
    if(getKey()){
      try{ reply='🤖 '+(await callRealAI(txt)).replace(/</g,'&lt;').replace(/\n/g,'<br>'); }
      catch(err){ reply='🤖 '+localReply(txt); toast(t('api_fail'),'warn'); }
    } else {
      await new Promise(r=>setTimeout(r,650));
      reply='🤖 '+localReply(txt);
    }
  } finally { sending=false; }
  typing.classList.remove('pulse'); typing.innerHTML=reply; box.scrollTop=box.scrollHeight; ting();
}
$('chatSend').onclick=()=>sendChat();
$('chatInput').addEventListener('keydown',e=>{
  // e.isComposing / keyCode 229 = đang gõ tiếng Việt (IME) → KHÔNG gửi
  if(e.key==='Enter' && !e.isComposing && e.keyCode!==229){ e.preventDefault(); sendChat(); }
});
document.querySelectorAll('.chat-q').forEach(b=>b.onclick=()=>{ document.querySelector('[data-tab="tab-ai"]').click(); sendChat(b.textContent); });

$('keySave').onclick=()=>{
  const k=$('keyInput').value.trim();
  if(k && !k.startsWith('sk-')){ toast(t('e_key'),'err'); return; }
  if(k) store.set('ppai_key',k); else store.del('ppai_key');
  store.set('ppai_model',$('modelSel').value);
  refreshKeyStatus(); updateAiMode();
  toast(k?t('set_saved'):t('set_cleared'),k?'ok':'warn');
  $('setOverlay').classList.remove('open');
};
$('keyClear').onclick=()=>{ store.del('ppai_key'); $('keyInput').value=''; refreshKeyStatus(); updateAiMode(); toast(t('set_cleared'),'warn'); };

/* ---------- CHUYỂN NGÔN NGỮ ---------- */
$('langBtn').onclick=()=>{
  lang = lang==='vi'?'en':'vi';
  store.set('ppai_lang',lang);
  applyLang();
  if(state.lastSummary) analyze(true);      // vẽ lại phân tích theo ngôn ngữ mới (không cộng điểm)
  if(state.reportBuilt) buildReport(true);  // vẽ lại báo cáo (không cộng điểm)
  toast(t('lang_sw'),'ok');
};

/* ---------- SỰ KIỆN GIAO DIỆN ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); $(b.dataset.tab).classList.add('active');
});
$('darkBtn').onclick=()=>{ document.body.classList.toggle('dark');
  $('darkBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
  if(state.reportBuilt) buildReport(true); }; // vẽ lại biểu đồ — silent, không cộng điểm
$('musicBtn').onclick=toggleMusic;
document.querySelectorAll('.preset[data-p]').forEach(b=>b.onclick=()=>{ const [ty,a,n]=b.dataset.p.split(':'); addTx(ty,parseFloat(a),n, ty==='chi'?1:2); });
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
  if(state.sortKey===b.dataset.sort) state.sortAsc=!state.sortAsc; else {state.sortKey=b.dataset.sort; state.sortAsc=false;}
  renderTx(); toast(t('t_sorted',b.textContent.trim()),'ok');
});
$('txAddBtn').onclick=()=>{
  const a=parseFloat($('txAmount').value);
  if(isNaN(a)||a<=0){ toast(t('e_amt'),'err'); $('txAmount').focus(); return; }
  const n=$('txNote').value.trim()||t('no_note');
  addTx($('txType').value,a,n,parseInt($('txPriority').value));
  $('txAmount').value=''; $('txNote').value='';
};
$('analyzeBtn').onclick=()=>analyze(false);

/* ---------- KHỞI ĐỘNG ---------- */
loadSampleData();
loadGame();
applyLang();
renderTx();
renderSubs();
checkSubReminders();
// Lời chào trong khung chat
$('chatBox').insertAdjacentHTML('beforeend','<div class="msg bot">🤖 '+t('greeting')+'</div>');
// Tự phân tích 1 lần để demo hiệu ứng ngay khi mở
setTimeout(()=>{ analyze(false); toast(t('welcome'),'ok'); },600);
</script>
</body>
</html>
